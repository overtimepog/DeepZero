# SDI R2601 triage pipeline: PE ingest → filter → top-30 → Ghidra + semgrep → LLM
# Runs Ghidra only on top 30 priority candidates — fast enough for 6,868 driver corpus
# Ghidra 12.1+ with pyghidra, JVM tuned (1G heap, ParallelGC, skip_analysis)
# Auto-extracts .7z/.zip archives during discovery

name: loldrivers_sdi
description: SDI R2601 driver corpus triage with Ghidra on top hits
version: "3.2"

model: deepseek/deepseek-v4-flash

settings:
  work_dir: work
  max_workers: 4

stages:
  # discover PE files, parse headers, extract driver metadata
  # auto-extracts .7z/.zip archives into .deepzero_cache/extracted/
  - name: discover
    processor: pe_ingest/pe_ingest.py
    config:
      extensions: [".sys"]
      recursive: true
      archive_extensions: [".7z", ".zip"]

  # filter to kernel drivers with IOCTL attack surface + dedup
  - name: kernel_filter
    processor: metadata_filter
    config:
      require:
        is_kernel_driver: true
        has_ioctl_surface: true
      dedup_field: sha256

  # exclude known LOLDrivers
  - name: loldrivers_filter
    processor: loldrivers_filter/loldrivers_filter.py

  # Fast objdump extraction — enriches metadata with IOCTL codes + device paths
  # v2.0: filters dead drivers before the Ghidra gate
  - name: fast_extract
    processor: objdump_extract/objdump_extract.py
    parallel: 0
    config:
      max_ioctl_codes: 50
      extract_device_paths: true
      extract_section_info: true
      extract_rdata_scan: true
      # Filtering
      min_ioctl_codes: 1
      require_device_path: true
      min_text_section_size: 1024

  # pick top 30 by fast_extract priority score BEFORE Ghidra (fast triage)
  - name: pick_top_30
    processor: top_k
    config:
      metric_path: fast_extract.priority_score
      keep_top: 30
      sort_order: desc

  # Ghidra decompile — only on top 30 candidates
  # skip_analysis skips full auto-analysis (type propagation, data-flow) — the dispatch
  # extraction script only needs function identification + decompiler (3-5x faster).
  # ParallelGC beats G1GC for short-lived JVMs. 1g heap is plenty for kernel drivers.
  # auto-cleans .gpr/.rep project dirs after each decompile
  - name: decompile
    processor: ghidra_decompile/ghidra_decompile.py
    parallel: 0
    timeout: 600
    config:
      strategy: extract_dispatch.py
      max_functions: 60
      max_depth: 4
      ghidra_install_dir: ${GHIDRA_INSTALL_DIR}
      java_home: ${JAVA_HOME:-}
      skip_analysis: true
      jvm_max_heap: "1g"
      jvm_init_heap: "512m"
      jvm_gc: "ParallelGC"
      project_base: "/tmp/ghidra_projects"

  # semgrep batch scan for IOCTL vulnerability patterns
  - name: semgrep_scanner
    processor: semgrep_scanner/semgrep_scanner.py
    config:
      min_findings: 1
      rules_dir: pipelines/loldrivers/rules

  # LLM deep analysis with decompiled code + semgrep findings
  - name: assess
    processor: generic_llm
    parallel: 0
    on_failure: skip
    config:
      prompt: pipelines/loldrivers/assessment.j2
      output_file: assessment.md
      classify_by: "\\\\[VULNERABLE\\\\]|\\\\[SAFE\\\\]"
      max_context_tokens: 128000
      max_retries: 3

  # post-pipeline storage cleanup: remove filtered/failed dirs, compress artifacts, wipe caches
  - name: cleanup
    processor: work_cleanup/work_cleanup.py
    config:
      clean_filtered: true
      compress_artifacts: true
      clean_archive_cache: true
      cleanup_stale_ghidra: true
