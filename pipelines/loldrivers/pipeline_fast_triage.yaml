# Fast triage with early filtering + Ghidra decompile on all survivors.
# fast_extract filters dead drivers (no IOCTL codes, no device path).
# Ghidra runs skip_analysis on ALL survivors — fast enough with lean JVM config.
# Semgrep scans decompiled C, filters zero-finding drivers, survivors go to LLM.
#
# Pipeline flow:
#   discover (auto-extract .7z/.zip) → kernel_filter → loldrivers_filter → fast_extract+filter
#     → decompile (Ghidra, skip_analysis, ALL survivors)
#     → semgrep_barrier → assess (LLM) → cleanup

name: loldrivers_fast
description: Fast triage with early filtering + Ghidra on all survivors + semgrep barrier
version: "6.0"

model: deepseek/deepseek-v4-flash

settings:
  work_dir: work
  max_workers: 5

stages:
  # discover PE files, parse headers, extract driver metadata (LIEF)
  # auto-extracts .7z/.zip archives into .deepzero_cache/extracted/
  - name: discover
    processor: pe_ingest/pe_ingest.py
    config:
      extensions: [".sys"]
      recursive: true
      archive_extensions: [".7z", ".zip"]

  # filter to kernel drivers with IOCTL attack surface + dedup
  - name: kernel_filter
    processor: metadata_filter
    config:
      require:
        is_kernel_driver: true
        has_ioctl_surface: true
      dedup_field: sha256

  # exclude known LOLDrivers
  - name: loldrivers_filter
    processor: loldrivers_filter/loldrivers_filter.py

  # Static IOCTL dispatch analysis with data-flow tracking (Capstone)
  # v4.0: replaces objdump_extract — data-flow tracking, jump table recovery,
  # confidence scoring, no device type range restrictions
  - name: fast_extract
    processor: ioctl_static_analyzer/ioctl_static_analyzer.py
    parallel: 0
    config:
      max_ioctl_codes: 50
      extract_device_paths: true
      extract_section_info: true
      extract_rdata_scan: true
      # Filtering — drop drivers that can't be exploited
      min_ioctl_codes: 1
      require_device_path: true
      min_text_section_size: 1024

  # Ghidra decompile — on ALL survivors (no top_k gate)
  # skip_analysis skips full auto-analysis (type propagation, data-flow) — the dispatch
  # extraction script only needs function identification + decompiler (3-5x faster).
  # ParallelGC beats G1GC for short-lived JVMs. 1g heap is plenty for kernel drivers.
  # auto-cleans .gpr/.rep project dirs after each decompile
  - name: decompile
    processor: ghidra_decompile/ghidra_decompile.py
    parallel: 0
    timeout: 600
    config:
      strategy: extract_dispatch.py
      max_functions: 60
      max_depth: 4
      ghidra_install_dir: ${GHIDRA_INSTALL_DIR}
      java_home: ${JAVA_HOME:-}
      skip_analysis: true
      jvm_max_heap: "1g"
      jvm_init_heap: "512m"
      jvm_gc: "ParallelGC"
      project_base: "/tmp/ghidra_projects"

  # semgrep batch scan on decompiled C — barrier: drops drivers with 0 findings
  - name: semgrep_barrier
    processor: semgrep_scanner/semgrep_scanner.py
    config:
      min_findings: 1
      rules_dir: pipelines/loldrivers/rules

  # LLM deep analysis with full context: PE metadata + IOCTL codes + decompiled dispatch + semgrep findings
  - name: assess
    processor: generic_llm
    parallel: 0
    on_failure: skip
    config:
      prompt: pipelines/loldrivers/assessment.j2
      output_file: assessment.md
      classify_by: "\\\\[VULNERABLE\\\\]|\\\\[SAFE\\\\]"
      max_context_tokens: 128000
      max_retries: 3

  # post-pipeline storage cleanup: remove filtered/failed dirs, compress artifacts, wipe caches
  - name: cleanup
    processor: work_cleanup/work_cleanup.py
    config:
      clean_filtered: true
      compress_artifacts: true
      clean_archive_cache: true
      cleanup_stale_ghidra: true
